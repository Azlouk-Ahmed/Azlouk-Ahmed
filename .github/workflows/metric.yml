name: Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.myhabits.svg
          token: ${{ secrets.METRICS__TOKEN }}
          committer_token: ${{ secrets.METRICS__TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_from: 100
          plugin_habits_days: 7
          config_timezone: Europe/Paris
